<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="UTF-8">
	<title>食べトモ - 店舗登録</title>
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<link rel="stylesheet" href="../static/css/style.css" th:href="@{/css/style.css}">
	
</head>

<body>

	<div th:replace="~{fragments/header :: main-header(false)}"></div>

	<!-- メインコンテンツ -->
	<main>
		<h2>新しい店舗を登録する</h2>

		<div class="action-area">
			
			<form action="./index.html" th:action="@{/shop/submit}" th:object="${shopForm}" method="post" enctype="multipart/form-data" style="width: 100%; max-width: 500px; margin: 0 auto;">

				<!-- 店舗名入力 -->
				<div class="form-group" style="text-align: left;">
					<label class="form-label">店舗名 <span class="required-mark">*</span></label>
					<input type="text" id="shopName" th:field="*{name}" placeholder="例：麺屋 小金" required >
					<p th:if="${#fields.hasErrors('name')}" th:errors="*{name}" style="color:#e74c3c; font-size:12px; margin-top:4px;"></p>
				</div>

				<!-- エリア入力 -->
				<div class="form-group" style="text-align: left;">
					<label class="form-label">エリア <span class="required-mark">*</span></label>
					<input type="text" id="area" th:field="*{area}" placeholder="例：武蔵新城、渋谷" required >
					<p th:if="${#fields.hasErrors('area')}" th:errors="*{area}" style="color:#e74c3c; font-size:12px; margin-top:4px;"></p>
				</div>

				<!-- ジャンル選択（パンくず式ドリルダウン） -->
				<div class="form-group" style="text-align: left;">
					<label class="form-label">ジャンル <span class="required-mark">*</span></label>

					<div class="genre-breadcrumb" id="genre-breadcrumb"></div>
					<div class="genre-options" id="genre-options"></div>
					<div class="genre-selected-display" id="genre-selected-display"></div>

					<!-- 実際に送信されるのはこのhiddenの値 -->
					<input type="hidden" id="genre" th:field="*{genre}">
					<p th:if="${#fields.hasErrors('genre')}" th:errors="*{genre}" style="color:#e74c3c; font-size:12px; margin-top:4px;"></p>
				</div>

				<!-- 住所入力欄 -->
				<div class="form-group" style="text-align: left;">
					<label class="form-label">住所 <span class="required-mark">*</span></label>
					<input type="text" id="address" th:field="*{address}" placeholder="例：神奈川県川崎市中原区上新城２丁目１−２７ 津久井ビル 1F" required >
					<p th:if="${#fields.hasErrors('address')}" th:errors="*{address}" style="color:#e74c3c; font-size:12px; margin-top:4px;"></p>
				</div>

				<!-- 営業時間入力（任意） -->
				<div class="form-group" style="text-align: left;">
					<label class="form-label">営業時間</label>
					<input type="text" id="businessHours" th:field="*{businessHours}" placeholder="例：11:00〜22:00（不定休）" >
				</div>

				<!-- マップ埋め込みURLの入力欄 -->
				<div class="form-group" style="text-align: left;">
					<label class="form-label">Googleマップ埋め込みURL</label>
					<input type="text" id="mapEmbedUrl" th:field="*{mapEmbedUrl}" placeholder="GoogleマップのURL、または「地図を埋め込む」のiframeタグを丸ごと貼り付けてもOK" >
					<p style="font-size: 11px; color: #666; margin-top: 4px;">※iframeタグごと貼り付けた場合は、src部分のURLだけ自動で抽出されます。未入力の場合は自動で店舗名の検索リンク仕様になります。</p>
				</div>

				<!-- 予算入力（任意） -->
				<div class="form-group" style="text-align: left;">
					<label class="form-label">予算（円）</label>
					<input type="number" id="budget" th:field="*{budget}" min="0" step="100" placeholder="例：3000" >
					<p th:if="${#fields.hasErrors('budget')}" th:errors="*{budget}" style="color:#e74c3c; font-size:12px; margin-top:4px;"></p>
				</div>

				<!-- 写真アップロード（任意） -->
				<div class="form-group" style="text-align: left;">
					<label class="form-label">お店の写真</label>
					<input type="file" id="photos" name="photos" accept="image/*" multiple>
				</div>

				<!-- ボタンエリア -->
				<div style="text-align: center; margin-top: 25px;">
					<button type="submit" class="add-shop-btn" style="width: 100%; padding: 12px; font-size: 16px; cursor: pointer; font-weight: bold;">店舗を登録する</button>
				</div>

			</form>
		</div>
	</main>

	<!-- ジャンル選択パンくずUIの初期化 -->
	<script th:inline="javascript">
		window.genreTreeData = /*[[${genreGroups}]]*/ [];
	</script>
	<script th:src="@{/js/genre_picker.js}"></script>
	<script>
		initGenrePicker({
			treeVar: window.genreTreeData,
			breadcrumbId: 'genre-breadcrumb',
			optionsId: 'genre-options',
			displayId: 'genre-selected-display',
			hiddenInputId: 'genre'
		});
	</script>

</body>
</html>
