<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="UTF-8">
	<title>食べトモ - 店舗登録完了</title>
	<link rel="stylesheet" href="../static/css/style.css" th:href="@{/css/style.css}">
</head>

<body>

	<div th:replace="~{fragments/header :: main-header(false)}"></div>

	<main class="container" style="text-align: center;">
		<h2 style="color: #4CAF50; margin-bottom: 20px;">✓ 店舗登録が完了しました</h2>

		<!-- メッセージを表示する部分 -->
		<p th:text="${message}" style="font-size: 16px; color: #333; line-height: 1.8; margin-bottom: 30px;">
			新しい店舗の登録が完了しました（ブラウザで直接開いた時のダミーテキスト）。
		</p>

		<div class="btn-group" style="justify-content: center;">
			<a href="./index.html" th:href="@{/}" class="review-btn" style="background-color: #ff9900;">店舗一覧へ戻る</a>
		</div>
	</main>

</body>
</html>
