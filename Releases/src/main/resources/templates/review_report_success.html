<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>レビューの通報完了 - 食べトモ</title>
    <link rel="stylesheet" href="../static/css/style.css" th:href="@{/css/style.css}">
</head>
<body>
    <div th:replace="~{fragments/header :: main-header(false)}"></div>

    <main class="container" style="text-align: center; margin-top: 50px;">
        <h2>通報を受け付けました</h2>
        <p>貴重なご意見ありがとうございます。管理者が内容を確認いたします。</p>

        <!-- ★渡された shopId を使って、元の店舗へ戻るリンクを作る -->
        <div style="margin-top: 30px;">
            <a th:href="@{/shop/detail/{id}(id=${shopId})}" class="back-btn">元の店舗へ戻る</a>
        </div>
    </main>
</body>
</html>
