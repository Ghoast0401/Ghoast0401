<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="UTF-8">
	<title>食べトモ - マイページ</title>
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>

<body>

	<div th:replace="~{fragments/header :: main-header(true)}"></div>

	<main>
		<!-- 削除申請送信後などのフラッシュメッセージ -->
		<div th:if="${message}" th:text="${message}"
			style="background-color:#e8f5e9; color:#2e7d32; padding:10px 15px; border-radius:6px; margin-bottom:15px;"></div>

		<!-- ユーザープロフィールカード -->
		<div class="shop-card" style="border-left: 5px solid #ff9900;">
			<div class="shop-info-section">
				<h2 style="margin: 0 0 10px 0;"><span th:text="${user.username}">テスト太郎</span> さんのマイページ</h2>
			</div>
			<div class="shop-meta">
				<p>これまでの投稿数：<span th:text="${myReviewList.size()}">2</span> 件</p>
			</div>
			<!-- ★ 追加：退職時などのための「削除申請」ボタン -->
			<div style="margin-top: 15px; text-align: right;">
				<form th:action="@{/account/delete-request}" method="post" onsubmit="return confirm('本当にアカウントの削除申請を送信しますか？');">
					<button type="submit" class="detail-btn" style="background-color: #ccc; color: #333; font-size: 12px; padding: 5px 10px; border: none; cursor: pointer;">アカウント削除申請</button>
				</form>
			</div>
		</div>

		<!-- 自分が投稿したレビュー一覧セクション -->
		<div class="review-section">
			<h2>あなたが投稿したレビュー一覧</h2>
			
			<div th:if="${#lists.isEmpty(myReviewList)}" class="action-area">
				<p>まだレビューを投稿していません。</p>
				<a href="/shop/list" th:href="@{/shop/list}" class="review-btn">店舗を探してレビューを書く</a>
			</div>

			<!-- 自分が投稿したレビューをループ表示 -->
			<div class="review-card" th:each="review : ${myReviewList}">
				<div class="review-header">
					<span class="review-user" style="font-size: 16px; color: #ff9900;" th:text="${review.shop.name}">店舗名</span>
					<span class="stars" th:text="${'★'.repeat(review.rating) + '☆'.repeat(5 - review.rating)}">★★★★☆</span>
					<span class="review-date" th:text="${#temporals.format(review.createdAt, 'yyyy/MM/dd')}">2026/07/16</span>
				</div>

				<div class="review-body" th:text="${review.comment}">
					レビュー本文がここに入ります。
				</div>

				<div class="btn-group" style="margin-top: 10px; justify-content: flex-end;">
					<a th:href="@{/mypage/review/edit/{id}(id=${review.id})}" class="detail-btn" style="background-color: #666; border: none; color: white; font-size: 12px; padding: 5px 10px; text-decoration: none;">編集</a>
					<form th:action="@{/mypage/review/delete/{id}(id=${review.id})}" method="post" style="display:inline;" onsubmit="return confirm('このレビューを削除しますか？');">
						<button type="submit" class="detail-btn" style="background-color: #e74c3c; color: white; border: none; font-size: 12px; padding: 5px 10px; cursor: pointer;">削除</button>
					</form>
				</div>
			</div>
		</div>
	</main>
</body>
</html>
