<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>アカウント作成 - 食べトモ</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
	<link rel="stylesheet" href="../../static/css/style.css" th:href="@{/css/style.css}"></head>
<body>

   <div th:replace="~{fragments/header :: main-header(false)}"></div>

    <main class="container auth-box">
        <h2 class="auth-title">アカウント作成</h2>
        <div th:if="${error}" style="color: red; margin-bottom: 15px; text-align: center;" th:text="${error}"></div>
        <form th:action="@{/register}" th:object="${accountForm}" method="post">
			<input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
            <div class="form-group">
            <label for="userName">ユーザー名</label>
            <!-- th:field を使うことで入力値の保持＆Formバインディングが行われます -->
            <input type="text" id="userName" th:field="*{userName}" placeholder="ユーザー名を入力してください">
            <!-- ユーザー名のエラー表示 -->
            <p th:if="${#fields.hasErrors('userName')}" th:errors="*{userName}" style="color: red; font-size: 0.9em;"></p>
        </div>

        <div class="form-group">
            <label for="password">パスワード</label>
            <input type="password" id="password" th:field="*{password}" placeholder="パスワードを入力してください">
            <!-- パスワードのエラー表示（8文字未満や空欄のときにここに出ます！） -->
            <p th:if="${#fields.hasErrors('password')}" th:errors="*{password}" style="color: red; font-size: 0.9em;"></p>
        </div>

            <button type="submit" class="submit-btn success">登録する</button>
        </form>

        <div class="form-footer">
            <a th:href="@{/login}">すでにアカウントをお持ちの方（ログイン画面へ）</a>
        </div>
    </main>

</body>
</html>
