<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="UTF-8">
	<title>食べトモ - レビュー投稿</title>
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<link rel="stylesheet" href="../static/css/style.css" th:href="@{/css/style.css}">
</head>

<body>

	<div th:replace="~{fragments/header :: main-header(false)}"></div>

	<main class="container">
		<h2>レビューを投稿する</h2>

		<!--  将来Javaに送るためのフォーム設定 -->
		<!-- 直接開いたときは「送信成功画面」に飛び、Java起動時は「/review/submit」にPOSTします -->
		<form action="./submit-success.html" th:action="@{/review/confirm}"  method="POST" enctype="multipart/form-data">

			<!-- 1. 店舗名（DB: 店舗名）※本来は選択式か自動入力 -->
			<div class="form-group">
				<label for="shopName">店舗名</label>
				<input type="text" id="shopName" name="shopName" th:value="${detailDto.name}" readonly class="readonly-input">
				<input type="hidden" name="shopId" th:value="${detailDto.id}">
			</div>

			<!-- . 評価（DB: 評価） -->
			<div class="form-group">
				<label for="rating">評価（5段階）</label>
				<select id="rating" name="rating" required>
					<option value="5">★★★★★ 5 (最高)</option>
					<option value="4">★★★★☆ 4 (満足)</option>
					<option value="3" selected>★★★☆☆ 3 (普通)</option>
					<option value="2">★★☆☆☆ 2 (微妙)</option>
					<option value="1">★☆☆☆☆ 1 (不満)</option>
				</select>
			</div>

			<!-- . 本文（DB: 本文 VARCHAR(200)） -->
			<div class="form-group">
    <label for="comment">レビュー本文（任意）</label>
    <textarea id="comment" name="comment" rows="10" maxlength="1000" placeholder="レビューを入力（任意）"></textarea>
    <p class="counter"><span id="charCount">0</span> / 1000文字</p>
</div>

			<!-- . 写真（DB: 写真テーブルから） -->
			<div class="form-group">
			<label for="photo">お店の写真（任意）</label>
			<input type="file" id="photo" name="photos" accept="image/*" multiple>    
    		<!-- プレビュー用の画像枠（最初は隠しておく）を追加 -->
    		<img id="photoPreview" src="" alt="プレビュー画像" style="max-width: 200px; display: none; margin-top: 10px; border-radius: 4px; border: 1px solid #ddd;">
			</div>

			<!--  日付・ユーザーID・ユーザー名は、画面で入力させずJava側（裏側）で自動取得してDBに入れます -->

			<button type="submit" class="submit-btn">レビューを投稿する</button>
		</form>
	</main>

	<!-- 文字数のカウントをするためのJS -->
<script>
    const commentArea = document.getElementById('comment');
    const charCount = document.getElementById('charCount');

    commentArea.addEventListener('input', () => {
        const length = commentArea.value.length;
        charCount.textContent = length;

        // 1000文字（上限）に達したら赤くする
        if (length >= 1000) {
            charCount.style.color = 'red';
        } else {
            charCount.style.color = 'black'; // 通常の色に戻す
        }
    });
    
    // --- 写真のプレビュー機能 ---
const photoInput = document.getElementById('photo');
const photoPreview = document.getElementById('photoPreview');

photoInput.addEventListener('change', (event) => {
    const file = event.target.files[0]; // 選ばれたファイルを取得
    
    if (file) {
        // ファイルがあればプレビュー用のURLを作って<img>タグにセット
        photoPreview.src = URL.createObjectURL(file);
        photoPreview.style.display = 'block'; // 画像を表示させる
    } else {
        // キャンセルされたら非表示に戻す
        photoPreview.src = '';
        photoPreview.style.display = 'none';
    }
});
</script>


</body>
</html>
