<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="UTF-8">
	<title>ログイン - 食べトモ</title>
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<link rel="stylesheet" href="../static/css/style.css" th:href="@{/css/style.css}">
</head>
<body>

	<div th:replace="~{fragments/header :: main-header(false)}"></div>
	<main class="container" style="max-width: 400px; margin: 40px auto;">
		<h2>ログイン</h2>

		<!-- ユーザー名/パスワードが間違っていた場合に表示 -->
		<p th:if="${param.error}" class="required-mark">
			ユーザー名またはパスワードが正しくありません。
		</p>

		<!-- ログアウト直後の表示 -->
		<p th:if="${param.logout}" style="color: green;">
			ログアウトしました。
		</p>

		<!-- アカウント作成直後の表示 -->
		<p th:if="${param.registered}" style="color: green;">
			アカウント作成が完了しました。ログインしてください。
		</p>

		<form th:action="@{/login}" method="post">
			<div class="form-group">
				<label for="username">ユーザー名</label>
				<input type="text" id="username" name="username" required>
			</div>
			<div class="form-group">
				<label for="password">パスワード</label>
				<input type="password" id="password" name="password" required>
			</div>
			<button type="submit" class="add-shop-btn" style="width: 100%; margin-top: 12px;">ログイン</button>
		</form>

		<p style="margin-top: 16px;">
			<a th:href="@{/register}">アカウントをお持ちでない方はこちら</a>
		</p>
	</main>

</body>
</html>
