<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="UTF-8">
	<title>食べトモ - レビュー内容の確認</title>
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<link rel="stylesheet" href="../static/css/style.css" th:href="@{/css/style.css}">
</head>

<body>

	<div th:replace="~{fragments/header :: main-header(false)}"></div>

	<main class="container">
		<h2>レビュー内容の確認</h2>

		<div class="form-group">
			<label>店舗名</label>
			<p th:text="${detailDto.name}">カレーハウス・タベログ</p>
		</div>

		<div class="form-group">
			<label>評価</label>
			<p th:text="${reviewForm.rating} + ' / 5'">3 / 5</p>
		</div>

		<div class="form-group">
			<label>口コミ本文</label>
			<p th:text="${reviewForm.comment}" style="white-space: pre-wrap;">コメント本文</p>
		</div>

		<div class="form-group" th:if="${photoCount != null && photoCount > 0}">
			<label>写真</label>
			<p th:text="${photoCount} + '枚の写真が選択されています'"></p>
		</div>

		<!-- btn-groupで囲み、横並びのレイアウトをCSSに任せる -->
		<div class="btn-group">
			<form th:action="@{/review/back}" method="POST">
				<button type="submit" class="secondary-btn">戻る</button>
			</form>

			<form th:action="@{/review/submit}" method="POST">
				<input type="hidden" name="rating" th:value="${reviewForm.rating}">
				<input type="hidden" name="comment" th:value="${reviewForm.comment}">
				<input type="hidden" name="shopId" th:value="${reviewForm.shopId}">
				<button type="submit" class="submit-btn">この内容で投稿する</button>
			</form>
		</div>
	</main>

</body>
</html>
