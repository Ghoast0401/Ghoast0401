<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
c
<body>
    <div th:replace="~{fragments/header :: main-header(false)}"></div>

    <main class="container" style="max-width: 600px; margin-top: 40px;">
        <h2>レビューを通報する</h2>
        <p style="font-size: 13px; color: #666; margin-bottom: 20px;">
            規約違反と思われるレビューをご報告ください。管理者が確認いたします。
        </p>

        <!-- ★POSTメソッドは今までと同じ宛先に送る -->
        <form th:action="@{/review/{id}/report(id=${reviewId})}" method="post">
            <input type="hidden" name="shopId" th:value="${shopId}">
            
            <div style="margin-bottom: 15px;">
                <label style="display: block; font-weight: bold; margin-bottom: 5px;">通報理由 <span style="color: red;">*</span></label>
                <select name="reason" required style="width: 100%; padding: 8px;">
                    <option value="">選択してください</option>
                    <option value="SPAM">誹謗中傷</option>
                    <option value="FAKE">虚偽内容</option>
                    <option value="OTHER">その他</option>
                </select>
            </div>
            
            <div style="margin-bottom: 20px;">
                <label style="display: block; font-weight: bold; margin-bottom: 5px;">詳細な理由（任意）</label>
                <textarea name="detail" rows="20" placeholder="問題のある箇所を具体的にご記入ください"
                    style="width: 100%; box-sizing: border-box; resize: none; padding: 8px;"></textarea>
            </div>
            
            <div style="display: flex; gap: 10px; justify-content: center;">
                <button type="submit" class="submit-btn" style="padding: 10px 30px;">送信する</button>
                <a th:href="@{/shop/detail/{id}(id=${shopId})}" class="back-btn" style="padding: 10px 30px;">キャンセル</a>
            </div>
        </form>
    </main>
</body>
</html>
